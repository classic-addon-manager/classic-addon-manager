[package]
name = "classic-addon-manager"
version = "4.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
form_urlencoded = "1.2.2"
gpui-kit = { version = "=0.9.0", features = ["inspector"] }
hex = "0.4.3"
html5ever = "0.39"
libc = "0.2.191"
log = "0.4.34"
markdown = "1.0.0"
markup5ever_rcdom = "0.39.0"
open = "5.4.4"
percent-encoding = "2.3.2"
regex = "1.13.1"
rust-embed = "8"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "3", features = ["json"] }
url = "2"
zip = "9.0.5"

[build-dependencies]
embed-resource = "3.0.12"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Keep the symbol table so panic backtraces in app.log show function names at a small cost to file size.
strip = "debuginfo"
lto = "fat"
codegen-units = 1

[target."cfg(windows)".dependencies]
base64 = "0.23.1"
raw-window-handle = "0.6"
