# Air config for `wails3 task dev:server`, rebuilding and restarting the
# server-mode binary only when Go sources change.
root = "."
tmp_dir = "build/tmp/air-server"

[build]
cmd = "go build -tags server -buildvcs=false -gcflags=all=\"-l\" -o build/bin/classic-addon-manager-server.exe"
bin = "build/bin/classic-addon-manager-server.exe"
full_bin = "build/bin/classic-addon-manager-server.exe"
include_ext = ["go"]
exclude_dir = ["build", "frontend", "assets", "node_modules", ".git"]
follow_symlink = false
delay = 3000
stop_on_error = true
send_interrupt = true
kill_delay = 2000
pid_file = "./build/tmp/air-server/pid"
log = "build/tmp/air-server/errors.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
